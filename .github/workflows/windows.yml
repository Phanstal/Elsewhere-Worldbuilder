name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the Windows assets to
        required: true
        default: v0.1.5

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 build
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x64

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build NSIS installer
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Build MSI installer
        continue-on-error: true
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles msi --ci

      - name: Verify installers and write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $installers = @(
            Get-ChildItem "$bundle/nsis/*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem "$bundle/msi/*.msi" -ErrorAction SilentlyContinue
          )
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }

          $lines = @()
          foreach ($file in $installers) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($file.Name)"
            "$hash  $($file.Name)" | Set-Content -Encoding ascii "$($file.FullName).sha256"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Elsewhere-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sha256
            SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: Attach Windows assets to the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ inputs.tag }}'
          $bundle = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $assets = @(
            Get-ChildItem "$bundle/nsis/*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem "$bundle/nsis/*.sha256" -ErrorAction SilentlyContinue
            Get-ChildItem "$bundle/msi/*.msi" -ErrorAction SilentlyContinue
            Get-ChildItem "$bundle/msi/*.sha256" -ErrorAction SilentlyContinue
            Get-Item 'SHA256SUMS-windows.txt'
          )
          gh release view $tag --json tagName,url
          gh release upload $tag $assets.FullName --clobber
          gh release view $tag --json assets --jq '.assets[] | [.name, .size] | @tsv'
