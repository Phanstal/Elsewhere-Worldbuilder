[package]
name = "elsewhere"
version = "0.1.0"
description = "A spatial studio for building and exploring fictional worlds."
authors = ["Phanstal"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "elsewhere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-window-state = "2"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
